server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE phải tắt buffering, nếu không nginx gom bản tin rồi mới nhả một thể.
    location /api/ {
        proxy_pass http://api:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://api:8010;
        proxy_set_header Host $host;
    }
}