name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: pytest backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cai dependencies
        run: pip install -r backend/requirements.txt
      - name: Chay pytest
        working-directory: backend
        run: python -m pytest -q

  web:
    name: build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cai dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck va build
        working-directory: web
        run: npm run build

  smoke:
    name: smoke API tren stack that
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tao .env cho runner
        # LIVE_ENABLED=false: runner o My hay bi Binance chan, va smoke khong can luong live.
        run: |
          cp .env.example .env
          printf 'LIVE_ENABLED=false\n' >> .env
      - name: Dung db + api (khong worker de khong cham san)
        run: docker compose up -d --build db api
      - name: Cho api khoe
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8010/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "api khong len sau 120s"
          docker compose logs --tail 100 api
          exit 1
      - name: Nap fixture nen that
        run: docker compose exec -T db psql -U marketlab -d marketlab -v ON_ERROR_STOP=1 < db/ci_fixture.sql
      - name: Smoke API doi chieu fixture
        run: python scripts/smoke_api.py http://127.0.0.1:8010
      - name: Log khi loi
        if: failure()
        run: docker compose logs --tail 200 api db
      - name: Don stack
        if: always()
        run: docker compose down -v